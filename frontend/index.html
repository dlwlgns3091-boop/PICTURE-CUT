<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이미지 로테이터 v2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 로그인 뷰 (Phase 2에서 실제 인증 연결) -->
  <section id="view-login" class="view" hidden>
    <div class="auth-card">
      <h1>📸 이미지 로테이터</h1>
      <p class="muted">블로그 포스팅용 이미지 자동 변형 도구</p>

      <form id="login-form" class="auth-form">
        <label>
          이메일
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          비밀번호
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn primary">로그인</button>
        <button type="button" id="btn-signup" class="btn ghost">회원가입</button>
      </form>

      <p id="login-error" class="error" hidden></p>
      <p class="muted small">※ 로그인 기능은 Phase 2에서 연결됩니다.</p>
    </div>
  </section>

  <!-- 메인 뷰 -->
  <section id="view-main" class="view">
    <header class="topbar">
      <div class="brand">📸 이미지 로테이터 <span class="badge">v2</span></div>
      <div class="topbar-actions">
        <button id="btn-settings" class="icon-btn" title="설정">⚙️</button>
        <button id="btn-logout" class="icon-btn" title="로그아웃">🔒</button>
      </div>
    </header>

    <main class="layout">
      <!-- 좌측: 업체 목록 -->
      <aside class="sidebar">
        <div class="sidebar-header">업체 목록</div>
        <ul id="company-list" class="company-list">
          <!-- JS 로 렌더링 -->
        </ul>
        <button id="btn-add-company" class="btn ghost full">➕ 새 업체</button>
      </aside>

      <!-- 우측: 업체 상세 -->
      <section class="detail">
        <div id="detail-empty" class="empty-state">
          <p>왼쪽에서 업체를 선택하거나 새로 추가하세요.</p>
        </div>

        <div id="detail-body" class="detail-body" hidden>
          <div class="detail-header">
            <h2 id="company-name">—</h2>
            <button id="btn-rename" class="btn ghost small">이름 변경</button>
            <button id="btn-delete" class="btn danger small">삭제</button>
          </div>

          <div class="stat-row">
            <div class="stat">📊 이미지 <span id="stat-count">0</span>장</div>
            <div class="stat">📅 최근 사용: <span id="stat-recent">—</span></div>
          </div>

          <div class="output-dir">
            <label>📁 결과 폴더</label>
            <div class="output-dir-row">
              <input id="input-output-dir" type="text" readonly placeholder="결과 폴더를 지정하세요">
              <button id="btn-pick-dir" class="btn">변경</button>
            </div>
          </div>

          <button id="btn-run" class="btn primary big">🎯 실행하기</button>

          <hr>

          <div class="pool-header">
            <h3>📷 이미지 풀</h3>
            <span class="muted small">드래그로 추가하거나 + 버튼을 클릭</span>
          </div>

          <div id="pool-grid" class="pool-grid">
            <button id="btn-add-image" class="pool-add">+</button>
            <!-- 썸네일은 JS 로 렌더링 -->
          </div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="status-msg">준비됨</span>
      <span id="status-env" class="muted small"></span>
    </footer>
  </section>

  <!-- 모달 컨테이너 -->
  <div id="modal-root"></div>

  <!-- 토스트 -->
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/companies.js"></script>
  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
